.top{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.lnk{position:relative;padding:9px 12px !important;display:inline-flex;align-items:center;background:var(--card);color:var(--acc);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:.8rem}
h1{color:var(--ink);margin:22px 0 38px;font-size:2rem;letter-spacing:.5px}
.wrap{position:relative;width:min(96vw,680px,max(300px,calc(100dvh - 270px)));margin:0 auto}
canvas{width:100%;display:block;border-radius:50%;box-shadow:0 14px 40px rgba(40,40,70,.28)}
.ptr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:44px solid var(--ptr);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));z-index:2}
button{font-family:inherit;cursor:pointer}
#spin{display:block;margin:22px auto 10px;background:var(--acc);color:var(--onacc);border:0;border-radius:40px;padding:14px 56px;font-size:1.3rem;font-weight:bold;box-shadow:0 6px 16px rgba(59,74,140,.35);letter-spacing:1px}
#spin:disabled{opacity:.6}
label{display:block;color:var(--mut);font-size:.9rem;padding-bottom:6px}
.ibtn{background:none;border:2px solid var(--acc);color:var(--acc);border-radius:50%;width:28px;height:28px;font-weight:bold;font-style:italic;flex:none}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--row);border-radius:10px;padding:10px;margin-bottom:8px;text-align:left}
.row b{color:var(--acc)}
.row div{flex:1;font-size:.9rem}
.row small{color:var(--mut);display:block}
.row.off{opacity:.55}
.pri{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:8px 18px;font-weight:bold}
.dng{background:#a83a3a;color:#fff;border:0;border-radius:8px;padding:6px 12px}
#modal{position:fixed;inset:0;background:rgba(10,10,20,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#box{background:var(--card);color:var(--ink);border-radius:14px;width:100%;max-width:520px;max-height:85vh;max-height:85dvh;overflow:auto;padding:18px;text-align:left}
#box h2{color:var(--acc);margin-top:0}
input,textarea{width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--row);color:var(--ink);font-family:inherit;font-size:1rem}
.bdg{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--onacc);font-size:.7rem;display:none;align-items:center;justify-content:center;padding:0 4px}
.top{gap:8px}
@media (max-width:480px){h1{font-size:1.6rem;margin:14px 0 30px}#spin{padding:12px 44px}}
.lead{font-weight:bold;margin:0 0 4px}
#box h3{margin:16px 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut)}
#box ul{margin:0;padding-left:20px}
#box li{margin-bottom:6px;line-height:1.4}
.ex{background:var(--row);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:.95rem;line-height:1.45}

 cx.fillStyle="#2b2f55";cx.font="bold 42px Georgia";cx.fillText("A",0,-28);
 cx.fillStyle="#c2485e";cx.font="60px Georgia";cx.fillText("\u2665",0,22);
 cx.restore();
}
function counts(){const n=V.filter(v=>v.off).length,b=document.getElementById("dbadge");b.textContent=n;b.style.display=n?"flex":"none"}
function refresh(){draw();counts();save()}
function tone(f,d,t,v,a){if(!snd||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v||.05,n+(a||.005));g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)}
function tick(){tone(900+Math.random()*80,.05,"triangle",.04,.002)}
function chime(){tone(523.25,1.4,"sine",.06,.03);setTimeout(()=>tone(659.25,1.6,"sine",.05,.03),180)}
const ICON_ON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',ICON_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
function toggleSnd(){snd=!snd;document.getElementById("snd").innerHTML=snd?ICON_ON:ICON_OFF}
function spin(){
 if(busy)return;
 const a=V.map((v,i)=>i).filter(i=>!V[i].off);
 if(!a.length){show("<h2>All greyed out</h2><p>Every variation is greyed out. Open Discarded and restore some.</p>");return}
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){ac=null}
 busy=true;document.getElementById("spin").disabled=true;
 const k=a[Math.floor(Math.random()*a.length)],S=360/V.length;
 const center=(k+.5)*S+(Math.random()-.5)*S*.7,start=rot;
 const delta=360*6+((((-center-start)%360)+360)%360),T0=performance.now(),DUR=5500;
 let last=-1;
 (function f(now){
  const t=Math.min(1,(now-T0)/DUR),e=1-Math.pow(1-t,4);
  rot=start+delta*e;cv.style.transform="rotate("+rot+"deg)";
  const idx=Math.floor((((-rot)%360)+360)%360/S);
  if(idx!==last){tick();last=idx}
  if(t<1)requestAnimationFrame(f);else done(k);
 })(performance.now());
}
function done(k){
 rot=rot%360;chime();
 const v=V[k];let note="";
 if(document.getElementById("rm").checked){v.off=true;note="<p style='opacity:.7'><small>This one will not be picked again.</small></p>"}
 refresh();busy=false;document.getElementById("spin").disabled=false;
 show("<h2>"+esc(v.n)+"</h2>"+fmt(v)+note,"Let’s play");
}
function fmt(v){
 const f=v.f;
 if(f&&typeof f==="object")return "<p class='lead'>"+esc(v.s)+"</p><h3>How it works</h3><ul>"+f.p.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul><h3>Example</h3><div class='ex'>"+esc(f.e)+"</div>";
 return "<p class='lead'>"+esc(v.s)+"</p>"+(f?"<p>"+esc(f)+"</p>":"");
}
function show(h,l){document.getElementById("box").innerHTML=h+"<p><button class='pri' onclick='closeM()'>"+(l||"Close")+"</button></p>";document.getElementById("modal").style.display="flex"}
function closeM(){document.getElementById("modal").style.display="none"}
function info(i,back){
 const v=V[i];
 show("<h2>"+esc(v.n)+"</h2>"+fmt(v)+(back?"<p><button class='lnk' onclick='"+back+"'>Back</button></p>":""));
}
function openAll(){
 show("<h2>All variations ("+V.length+")</h2>"+V.map((v,i)=>"<div class='row"+(v.off?" off":"")+"'><div><b>"+esc(v.n)+"</b>"+(v.off?" (greyed out)":"")+"<small>"+esc(v.s)+"</small></div><button class='ibtn' onclick='info("+i+",\"openAll()\")'>i</button></div>").join(""));
}
function openOff(){
 const o=V.map((v,i)=>i).filter(i=>V[i].off);
 show("<h2>Discarded variations</h2>"+(o.length?o.map(i=>"<div class='row'><div><b>"+esc(V[i].n)+"</b></div><button class='pri' onclick='restore("+i+")'>Restore</button></div>").join("")+"<p><button class='pri' onclick='restoreAll()'>Restore all</button></p>":"<p>Nothing discarded yet.</p>"));
}
function restore(i){V[i].off=false;refresh();openOff()}
function restoreAll(){V.forEach(v=>v.off=false);refresh();openOff()}
function openManage(){
 show("<h2>Add / remove variations</h2><input id='an' placeholder='Variation name'><input id='as' placeholder='Short description (1-2 lines)'><textarea id='af' rows='3' placeholder='Full rules (optional)'></textarea><p><button class='pri' onclick='addV()'>Add variation</button></p><h2>Current list</h2>"+V.map((v,i)=>"<div class='row'><div><b>"+esc(v.n)+"</b></div><button class='dng' onclick='delV("+i+")'>Remove</button></div>").join("")+"<p><button class='dng' onclick='resetV()'>Reset to defaults</button></p>");
}
function addV(){
 const n=document.getElementById("an").value.trim();
 if(!n)return;
 V.push({n:n,s:document.getElementById("as").value.trim()||"Custom variation.",f:document.getElementById("af").value.trim(),off:false});
 refresh();openManage();
}
function delV(i){if(confirm("Remove "+V[i].n+" permanently?")){V.splice(i,1);refresh();openManage()}}
function resetV(){if(confirm("Restore the original variations? Your changes will be lost.")){V=D.map(a=>({n:a[0],s:a[1],f:F[a[0]]||a[2]||"",off:false}));refresh();openManage()}}
refresh();
</script>
